[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surprise-claude"
version = "1.1.0"
description = "🎯 Surprise Claude — 打破算法茧房，随机生成学习计划。大工黑客松 S2 Track 03。"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Surprise Claude Team" },
]
keywords = ["cli", "claude", "openai", "learning", "hackathon", "serendipity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Terminals",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "colorama>=0.4",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.39.0"]
openai = ["openai>=1.0"]
all = ["anthropic>=0.39.0", "openai>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
surprise-claude = "surprise_claude.cli:app"

[project.urls]
Homepage = "https://github.com/qzqzqdwww/Hackathon-S2"
Repository = "https://github.com/qzqzqdwww/Hackathon-S2"
"Bug Tracker" = "https://github.com/qzqzqdwww/Hackathon-S2/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["surprise_claude*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
